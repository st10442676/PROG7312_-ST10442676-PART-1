name: Smart-X Continuous Integration

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test Smart-X
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Display .NET information
        run: dotnet --info

      - name: Restore NuGet packages
        run: dotnet restore Smart-X.sln

      - name: Build solution
        run: >
          dotnet build Smart-X.sln
          --configuration Release
          --no-restore

      - name: Run automated tests
        run: >
          dotnet test Smart-X.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=smartx-test-results.trx"
          --results-directory TestResults

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartx-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14